<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d12468" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so a dark-mode user never sees a white flash.
      try {
        var t = localStorage.getItem("herai.theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <title>Lunee — Period tracker and women's health companion</title>
    <meta
      name="description"
      content="Lunee is a private period and cycle tracker with an AI health companion, lab report explanations, and a way to share support with a partner. Available in English and Hindi."
    />
    <link rel="canonical" href="https://lunee.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lunee" />
    <meta property="og:url" content="https://lunee.me/" />
    <meta property="og:title" content="Lunee — Period tracker and women's health companion" />
    <meta
      property="og:description"
      content="Track your cycle, ask health questions, understand lab reports, and let a partner support you. Private by design."
    />
    <meta property="og:image" content="https://lunee.me/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lunee",
        "url": "https://lunee.me/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "A private period and cycle tracker with an AI health companion, lab report explanations, and partner support."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
